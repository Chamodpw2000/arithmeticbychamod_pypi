[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmeticbychamod"
readme="README.md"
version = "0.2.1"
description = "A tiny arithmetic library built to learn Python packaging"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chamod Wanigasekara" }]
classifiers = [
    "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]

