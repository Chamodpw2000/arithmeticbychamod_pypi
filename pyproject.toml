[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmeticbychamod"
readme="README.md"
version = "0.1.0"
description = "A tiny arithmetic library built to learn Python packaging"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chamod Wanigasekara" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["src"]